<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Process pool: workers and a shared job queue</title><link rel="stylesheet" href="animation.css"></head>
<body>
<h1>A pool of worker processes and one shared job queue</h1>
<style>
.chip{transition:transform .35s ease}
.zone{fill:none;stroke:var(--border-strong);stroke-width:0.5}
</style>
<svg viewBox="0 0 680 336" role="img">
<title>Process pool with a shared job queue</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="th" x="14" y="30">Job queue (waiting)</text>
<rect class="zone" x="14" y="40" width="180" height="152" rx="8"/>
<text class="th" x="250" y="30">Pool: worker processes</text>
<text class="th" x="548" y="30">Done</text>
<rect class="zone" x="548" y="40" width="118" height="184" rx="8"/>
<line class="arr" x1="198" y1="116" x2="244" y2="116" marker-end="url(#arrow)"/>
<line class="arr" x1="524" y1="116" x2="546" y2="116" marker-end="url(#arrow)"/>
<g id="wk"></g>
<g id="jobs"></g>
</svg>
<div style="display:flex;align-items:center;gap:10px;margin:8px 0 0;flex-wrap:wrap;color:var(--text-secondary)">
<label for="n">Workers in the pool</label>
<select id="n"><option>1</option><option>2</option><option selected>4</option><option>6</option></select>
<button id="replay">Replay</button><button id="pp">Pause</button>
</div>
<div style="margin:10px 0 0">
<div id="status" style="font-size:15px;font-weight:500"></div>
<div id="ev" style="color:var(--text-secondary);margin-top:2px;min-height:21px"></div>
</div>
<script>
const NS='http://www.w3.org/2000/svg';
const D=[2,1,3,2,1,2,3,1,2,2,1,3];
const SERIAL=D.reduce((a,b)=>a+b,0);
const COL={q:['#D3D1C7','#2C2C2A'],r:['#AFA9EC','#26215C'],d:['#5DCAA5','#04342C']};
const RATE=1.6, BAR=170;
let N=4,queue,workers,done,t,last,paused=false,raf=0,ev='';
function mk(tag,at,par){const e=document.createElementNS(NS,tag);for(const k in at)e.setAttribute(k,at[k]);par.appendChild(e);return e;}
const wk=document.getElementById('wk');
const wg=[];
for(let i=0;i<6;i++){
  const g=mk('g',{},wk);
  mk('rect',{class:'zone',x:250,y:40+i*44,width:270,height:36,rx:8},g);
  const lab=mk('text',{class:'ts',x:260,y:58+i*44,'dominant-baseline':'central'},g);lab.textContent='W'+(i+1);
  mk('rect',{x:342,y:53+i*44,width:BAR,height:10,rx:3,fill:'var(--border)'},g);
  const bar=mk('rect',{x:342,y:53+i*44,width:0,height:10,rx:3,fill:'#7F77DD'},g);
  wg.push({g,bar});
}
const jg=document.getElementById('jobs'),chips=[];
for(let j=0;j<12;j++){
  const g=mk('g',{class:'chip'},jg);
  const r=mk('rect',{width:44,height:24,rx:6,stroke:'none'},g);
  const tx=mk('text',{class:'th',x:22,y:12,'text-anchor':'middle','dominant-baseline':'central'},g);
  tx.textContent='J'+(j+1);
  chips.push({g,r,tx});
}
function reset(){
  N=parseInt(document.getElementById('n').value,10);
  queue=D.map((_,i)=>i);workers=Array.from({length:N},()=>({job:null,rem:0}));
  done=[];t=0;ev='';last=null;
  wg.forEach((w,i)=>{w.g.style.opacity=i<N?1:0;});
  assign();render();
}
function assign(){
  const took=[];
  workers.forEach((w,i)=>{
    if(w.job===null&&queue.length>0){w.job=queue.shift();w.rem=D[w.job];took.push('W'+(i+1)+' takes J'+(w.job+1));}
  });
  if(took.length>0)ev=took.join(', ');
}
function render(){
  chips.forEach((c,j)=>{
    let x,y,s;
    const qi=queue.indexOf(j),di=done.indexOf(j),wi=workers.findIndex(w=>w.job===j);
    if(qi>=0){x=22+(qi%3)*58;y=50+Math.floor(qi/3)*34;s='q';}
    else if(wi>=0){x=292;y=46+wi*44;s='r';}
    else{x=556+(di%2)*52;y=50+Math.floor(di/2)*28;s='d';}
    c.g.style.transform='translate('+x+'px,'+y+'px)';
    c.r.setAttribute('fill',COL[s][0]);c.tx.style.fill=COL[s][1];
  });
  workers.forEach((w,i)=>{wg[i].bar.setAttribute('width',w.job===null?0:BAR*(1-w.rem/D[w.job]));});
  const busy=workers.filter(w=>w.job!==null).length;
  const st=document.getElementById('status');
  st.textContent=done.length===12
    ?'All 12 jobs done at t = '+t.toFixed(1)+'. One worker alone would need t = '+SERIAL+'.'
    :'t = '+t.toFixed(1)+'  |  '+busy+' running, '+queue.length+' waiting, '+done.length+' done';
  document.getElementById('ev').textContent=done.length===12?'':ev;
}
function tick(now){
  if(last===null)last=now;
  const dt=paused?0:Math.min((now-last)/1000,0.1)*RATE;
  last=now;
  if(done.length<12){
    t+=dt;
    workers.forEach((w,i)=>{
      if(w.job!==null){w.rem-=dt;if(w.rem<=0){done.push(w.job);ev='W'+(i+1)+' finished J'+(w.job+1)+' and is free';w.job=null;}}
    });
    assign();
    render();
  }
  raf=requestAnimationFrame(tick);
}
document.getElementById('n').onchange=reset;
document.getElementById('replay').onclick=()=>{reset();paused=false;document.getElementById('pp').textContent='Pause';};
document.getElementById('pp').onclick=function(){paused=!paused;this.textContent=paused?'Play':'Pause';};
reset();
setTimeout(()=>{last=null;raf=requestAnimationFrame(tick);},500);
</script>
</body></html>
