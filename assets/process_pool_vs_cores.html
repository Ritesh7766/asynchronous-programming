<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Process pool: more workers than cores</title><link rel="stylesheet" href="animation.css"></head>
<body>
<h1>More workers than cores: the cores get shared</h1>
<style>
.chip{transition:transform .35s ease}
.zone{fill:none;stroke:var(--border-strong);stroke-width:0.5}
table.res{border-collapse:collapse;font-size:13px;margin-top:8px}
table.res td,table.res th{padding:3px 12px 3px 0;text-align:left;font-weight:400;color:var(--text-secondary)}
table.res th{color:var(--text-primary);font-weight:500}
</style>
<svg viewBox="0 0 680 366" role="img">
<title>Worker processes sharing four CPU cores</title>
<text class="th" x="14" y="30">Job queue</text>
<rect class="zone" x="14" y="40" width="140" height="190" rx="8"/>
<text class="th" x="186" y="30">Worker processes</text>
<text class="th" x="506" y="30">CPU cores (4)</text>
<rect class="zone" x="506" y="40" width="160" height="130" rx="8"/>
<text class="th" x="506" y="190">Done</text>
<rect class="zone" x="506" y="198" width="160" height="150" rx="8"/>
<g id="wk"></g>
<g id="cores"></g>
<g id="jobs"></g>
</svg>
<div style="display:flex;align-items:center;gap:10px;margin:8px 0 0;flex-wrap:wrap;color:var(--text-secondary)">
<label for="n">Workers in the pool</label>
<select id="n"><option>2</option><option selected>4</option><option>8</option><option>12</option></select>
<label style="display:flex;align-items:center;gap:6px"><input type="checkbox" id="ov">Add switching overhead</label>
<button id="replay">Replay</button><button id="pp">Pause</button>
</div>
<div style="margin:10px 0 0">
<div id="status" style="font-size:15px;font-weight:500"></div>
<div id="ev" style="color:var(--text-secondary);margin-top:2px;min-height:21px"></div>
<table class="res" id="res"></table>
</div>
<script>
const NS='http://www.w3.org/2000/svg';
const D=[2,1,3,2,1,2,3,1,2,2,1,3],C=4,RATE=1.6,BAR=140;
const COL={q:['#D3D1C7','#2C2C2A'],r:['#AFA9EC','#26215C'],d:['#5DCAA5','#04342C']};
let N=4,queue,workers,done,t,last=null,paused=false,ev='',results={};
function mk(tag,at,par){const e=document.createElementNS(NS,tag);for(const k in at)e.setAttribute(k,at[k]);par.appendChild(e);return e;}
const wg=[];
for(let i=0;i<12;i++){
  const g=mk('g',{},document.getElementById('wk'));
  mk('rect',{class:'zone',x:186,y:40+i*26,width:304,height:24,rx:6},g);
  const l=mk('text',{class:'ts',x:194,y:52+i*26,'dominant-baseline':'central'},g);l.textContent='W'+(i+1);
  mk('rect',{x:274,y:46+i*26,width:BAR,height:12,rx:3,fill:'var(--border)'},g);
  const bar=mk('rect',{x:274,y:46+i*26,width:0,height:12,rx:3,fill:'#7F77DD'},g);
  const sp=mk('text',{class:'ts',x:424,y:52+i*26,'dominant-baseline':'central'},g);
  wg.push({g,bar,sp});
}
const cg=[];
for(let c=0;c<C;c++){
  const x=514+(c%2)*74,y=50+Math.floor(c/2)*60;
  const g=mk('g',{},document.getElementById('cores'));
  const r=mk('rect',{x,y,width:68,height:50,rx:8,fill:'var(--bg-neutral)',stroke:'var(--border-strong)','stroke-width':0.5},g);
  const a=mk('text',{class:'th',x:x+34,y:y+18,'text-anchor':'middle','dominant-baseline':'central'},g);a.textContent='core '+(c+1);
  const b=mk('text',{class:'ts',x:x+34,y:y+35,'text-anchor':'middle','dominant-baseline':'central'},g);
  cg.push({r,b});
}
const chips=[];
for(let j=0;j<12;j++){
  const g=mk('g',{class:'chip'},document.getElementById('jobs'));
  const r=mk('rect',{width:44,height:22,rx:6},g);
  const tx=mk('text',{class:'th',x:22,y:11,'text-anchor':'middle','dominant-baseline':'central'},g);tx.textContent='J'+(j+1);
  chips.push({g,r,tx});
}
function busyCount(){return workers.filter(w=>w.job!==null).length;}
function speed(){
  const b=busyCount();if(b<=C)return 1;
  let s=C/b;
  if(document.getElementById('ov').checked)s=s/(1+0.05*(b-C));
  return s;
}
function assign(){
  const took=[];
  workers.forEach((w,i)=>{if(w.job===null&&queue.length>0){w.job=queue.shift();w.rem=D[w.job];took.push('W'+(i+1)+' takes J'+(w.job+1));}});
  if(took.length>0&&took.length<4)ev=took.join(', ');
}
function reset(){
  N=parseInt(document.getElementById('n').value,10);
  queue=D.map((_,i)=>i);workers=Array.from({length:N},()=>({job:null,rem:0}));
  done=[];t=0;ev='';last=null;
  wg.forEach((w,i)=>{w.g.style.opacity=i<N?1:0;});
  assign();render();
}
function render(){
  chips.forEach((c,j)=>{
    let x,y,s;
    const qi=queue.indexOf(j),di=done.indexOf(j),wi=workers.findIndex(w=>w.job===j);
    if(qi>=0){x=22+(qi%2)*54;y=50+Math.floor(qi/2)*30;s='q';}
    else if(wi>=0){x=222;y=41+wi*26;s='r';}
    else{x=514+(di%3)*50;y=208+Math.floor(di/3)*30;s='d';}
    c.g.style.transform='translate('+x+'px,'+y+'px)';
    c.r.setAttribute('fill',COL[s][0]);c.tx.style.fill=COL[s][1];
  });
  const sp=speed(),b=busyCount();
  workers.forEach((w,i)=>{
    wg[i].bar.setAttribute('width',w.job===null?0:BAR*(1-w.rem/D[w.job]));
    wg[i].sp.textContent=w.job===null?'':Math.round(sp*100)+'% speed';
  });
  cg.forEach((c,k)=>{
    c.r.style.fill=k<Math.min(b,C)?'#AFA9EC':'var(--bg-neutral)';
    c.b.style.fill=k<Math.min(b,C)?'#26215C':'var(--text-secondary)';
    c.b.textContent=b===0?'idle':b>C?(b/C).toFixed(1)+' workers':(k<b?'1 worker':'idle');
  });
  const st=document.getElementById('status'),evEl=document.getElementById('ev');
  if(done.length===12){
    st.textContent='All 12 jobs done at t = '+t.toFixed(1);
    evEl.textContent='';
  }else{
    st.textContent='t = '+t.toFixed(1)+'  |  '+b+' busy workers on '+C+' cores, each at '+Math.round(sp*100)+'% speed';
    evEl.textContent=b>C?'Workers outnumber cores: the OS time-slices, so every job slows down.':(b===C?'Every worker has a core to itself: the cores are fully used.':'Fewer workers than cores: some cores sit idle.');
  }
}
function showResults(){
  const ks=Object.keys(results).map(Number).sort((a,b)=>a-b);
  const tb=document.getElementById('res');
  while(tb.firstChild)tb.removeChild(tb.firstChild);
  if(ks.length===0)return;
  const h=document.createElement('tr');
  ['Workers','Finished at'].forEach(s=>{const th=document.createElement('th');th.textContent=s;h.appendChild(th);});
  tb.appendChild(h);
  ks.forEach(k=>{
    const tr=document.createElement('tr');
    [k+(k>C?' (more than cores)':''),'t = '+results[k].toFixed(1)].forEach(s=>{const td=document.createElement('td');td.textContent=s;tr.appendChild(td);});
    tb.appendChild(tr);
  });
}
function tick(now){
  if(last===null)last=now;
  const dt=paused?0:Math.min((now-last)/1000,0.1)*RATE;
  last=now;
  if(done.length<12){
    t+=dt;
    const s=speed();
    workers.forEach((w,i)=>{
      if(w.job!==null){w.rem-=dt*s;if(w.rem<=0){done.push(w.job);w.job=null;}}
    });
    assign();
    if(done.length===12){results[N]=t;showResults();}
    render();
  }
  requestAnimationFrame(tick);
}
document.getElementById('n').onchange=reset;
document.getElementById('ov').onchange=()=>{results={};showResults();reset();};
document.getElementById('replay').onclick=()=>{reset();paused=false;document.getElementById('pp').textContent='Pause';};
document.getElementById('pp').onclick=function(){paused=!paused;this.textContent=paused?'Play':'Pause';};
reset();
setTimeout(()=>{last=null;requestAnimationFrame(tick);},500);
</script>
</body></html>
